# Runs as the unprivileged user 10001 (docker-local, section 1): pid and temp paths are under /tmp, the port is above 1024.
pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # The headers are also set here so that answers made before a location is chosen (the 405 below, nginx's own 400 and 414)
        # carry them: a location that sets add_header itself does not inherit these, so each location includes them again.
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;

        # A static site: only GET and HEAD, no request body.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location = /health/liveness {
            default_type text/plain;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
            return 200 "ok\n";
        }

        # Built files carry a content hash in their names.
        location /assets/ {
            include /etc/nginx/security-headers.conf;
            # No `always`: only a found file is cached as immutable, a 404 is not.
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Every other path is a screen of the single-page app; the token travels in the fragment, which never reaches here.
        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
            try_files $uri /index.html;
        }
    }
}
