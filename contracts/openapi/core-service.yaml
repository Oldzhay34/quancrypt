components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'UI oturumu: yerel, rastgele üretilmiş oturum token''ı (FR-02); JWT olması gerekmez.'
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Servisler arası çağrılar için iç token (`INTERNAL_SERVICE_TOKEN`, `.env`).
  parameters:
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      description: İzleme kimliği; yoksa servis üretir ve yanıtta döner.
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,128}$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Komutun tekrarını tek sonuca bağlar; aynı anahtar başka istekle gelirse 409 `idempotency-conflict`.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Kaynağın `version` değeri (tırnak içinde, örn. `"3"`); uyuşmazsa 409 `concurrent-modification`, eksikse
        428.
      schema:
        type: string
        pattern: ^"[0-9]+"$
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  headers:
    TraceId:
      description: İzleme kimliği.
      schema:
        type: string
  responses:
    BadRequest:
      description: İstek geçersiz.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Kimlik doğrulama başarısız.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Uç yalnızca servisler arası çağrıya açıktır.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Kaynak bulunamadı.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Çakışma; `type` alanı nedeni söyler.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Gövde izin verilen boyutu (20 MiB) aşıyor.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Desteklenmeyen ortam türü.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: '`If-Match` başlığı zorunludur.'
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Beklenmeyen hata.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: 'RFC 9457 problem details. `type` değeri `https://quancrypt.local/problems/<kod>` biçimindedir (kodlar:
        validation-failed, unauthorized, forbidden, not-found, scan-already-running, scan-not-running, scan-not-completed,
        finding-limit-exceeded, plan-already-exists, invalid-state-transition, concurrent-modification, idempotency-conflict,
        precondition-required, payload-too-large, unsupported-media-type, internal-error).'
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
      required:
      - type
      - title
      - status
      additionalProperties: true
    ProjectRegistration:
      type: object
      properties:
        identity:
          type: string
          minLength: 1
          maxLength: 2048
          writeOnly: true
          description: İstemcinin normalleştirilmiş proje kimliği (kök yol veya git remote). Saklanmaz; yalnızca HMAC'i `projectKey`
            olarak saklanır (D-129).
        displayName:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false
      required:
      - identity
      - displayName
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectKey:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Proje kimliğinin HMAC-SHA256 özeti.
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - id
      - projectKey
      - displayName
      - createdAt
    RuntimeProfileInput:
      type: object
      properties:
        javaVersion:
          type: string
          pattern: ^[0-9A-Za-z._+-]{1,32}$
        springBootVersion:
          oneOf:
          - type: string
            pattern: ^[0-9A-Za-z._+-]{1,32}$
          - type: 'null'
          description: null = Spring Boot projesi değil veya bilinmiyor.
      additionalProperties: false
      required:
      - javaVersion
    RuntimeProfile:
      type: object
      properties:
        sequenceNo:
          type: integer
          minimum: 1
        javaVersion:
          type: string
          pattern: ^[0-9A-Za-z._+-]{1,32}$
        springBootVersion:
          oneOf:
          - type: string
            pattern: ^[0-9A-Za-z._+-]{1,32}$
          - type: 'null'
        recordedAt:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - sequenceNo
      - javaVersion
      - springBootVersion
      - recordedAt
    ProjectDetail:
      type: object
      properties:
        project:
          $ref: '#/components/schemas/Project'
        currentRuntimeProfile:
          oneOf:
          - $ref: '#/components/schemas/RuntimeProfile'
          - type: 'null'
      additionalProperties: false
      required:
      - project
      - currentRuntimeProfile
    ProjectPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 200
        totalElements:
          type: integer
          minimum: 0
      additionalProperties: false
      required:
      - items
      - page
      - size
      - totalElements
    PrivacyNotice:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        textTr:
          type: string
        textEn:
          type: string
        publishedAt:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - version
      - textTr
      - textEn
      - publishedAt
    ConsentGrant:
      type: object
      properties:
        consentType:
          type: string
          enum:
          - WAREHOUSE_ANALYTICS
          - MODEL_TRAINING
        privacyNoticeVersion:
          type: integer
          minimum: 1
          description: EN SON aydınlatma metni sürümü olmalıdır; değilse 400.
      additionalProperties: false
      required:
      - consentType
      - privacyNoticeVersion
    Consent:
      type: object
      properties:
        consentType:
          type: string
          enum:
          - WAREHOUSE_ANALYTICS
          - MODEL_TRAINING
        privacyNoticeVersion:
          type: integer
          minimum: 1
        grantedAt:
          type: string
          format: date-time
        revokedAt:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
          description: null = onay geçerli.
        version:
          type: integer
          minimum: 0
          description: İyimser kilit sürümü; `If-Match` ve `ETag` değeridir.
      additionalProperties: false
      required:
      - consentType
      - privacyNoticeVersion
      - grantedAt
      - revokedAt
      - version
    ConsentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Consent'
      additionalProperties: false
      required:
      - items
    Scan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - RUNNING
          - COMPLETED
          - FAILED
        startedAt:
          type: string
          format: date-time
        completedAt:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        runtimeProfileSequenceNo:
          type:
          - integer
          - 'null'
          description: Taramanın yapıldığı andaki profil; null = profil henüz kaydedilmemişti.
      additionalProperties: false
      required:
      - id
      - projectId
      - status
      - startedAt
      - completedAt
      - runtimeProfileSequenceNo
    ScanPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Scan'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 200
        totalElements:
          type: integer
          minimum: 0
      additionalProperties: false
