openapi: 3.1.0
info:
  title: Quancrypt core-service API
  version: 1.0.0-draft
  description: 'core-service ortak bilgi modelidir (Blackboard): projeler, KVKK onayları, taramalar, bulgular, topoloji, planlar,
    denetim günlüğü ve outbox. TASLAK: P2.1 tasarım kontratıdır; G-CORE-DB onayına kadar kod yazılmaz (D-17). Her uç tek bir
    use case''e karşılık gelir (`operationId` = use case adı; 28 uç). Hatalar RFC 9457; komut POST''ları `Idempotency-Key`
    kabul eder (istisna: `RelayOutboxEvents`, at-least-once teslim); sayfalar en çok 200 kayıt. Kaynak adları çoğuldur; tarama
    başına tek olan alt kaynaklar (`topology`, `artifact`, `plan`, `completion`, `profile`) tekil kalır. Transaction planı:
    `docs/data/core_db-transactions.md`.'
servers:
- url: http://127.0.0.1:8081
  description: Yerel geliştirme (core-service, docs/ports.md)
tags:
- name: Proje
- name: Onay
- name: Tarama
- name: Profil
- name: Plan
- name: Denetim ve olay
paths:
  /api/v1/projects:
    post:
      operationId: RegisterProject
      summary: RegisterProject
      tags:
      - Proje
      description: 'Girdi: `identity` (istemcinin normalleştirilmiş proje kimliği: kök yol veya git remote), `displayName`.
        Çıktı: `Project` (`id`, `projectKey`, `displayName`, `createdAt`). Başarı: 201 (yeni), 200 (aynı kimlik zaten kayıtlı).
        409 nedenleri (problem `type`): `idempotency-conflict`.'
      parameters:
      - $ref: '#/components/parameters/TraceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - bearerAuth: []
      - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRegistration'
      responses:
        '201':
          description: Oluşturuldu
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '200':
          description: Başarılı
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: ListProjects
      summary: ListProjects
      tags:
      - Proje
      description: 'Girdi: `page`, `size` (≤ 200). Çıktı: Sayfalı `Project` listesi. Başarı: 200.'
      parameters:
      - $ref: '#/components/parameters/TraceId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      security:
      - bearerAuth: []
      - internalToken: []
      responses:
        '200':
          description: Başarılı
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/projects/{projectId}:
    get:
      operationId: GetProject
      summary: GetProject
      tags:
      - Proje
      description: 'Girdi: `projectId`. Çıktı: `Project` + güncel çalışma zamanı profili (`v_project_current_runtime`). Başarı:
        200.'
      parameters:
      - $ref: '#/components/parameters/TraceId'
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
      - internalToken: []
      responses:
        '200':
          description: Başarılı
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: DeleteProject
      summary: DeleteProject
      tags:
      - Proje
      description: 'Girdi: `projectId`. Çıktı: —. Başarı: 204.'
      parameters:
      - $ref: '#/components/parameters/TraceId'
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Yanıt gövdesi yok
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/projects/{projectId}/runtime-profiles:
    post:
      operationId: RecordRuntimeProfile
      summary: RecordRuntimeProfile
      tags:
      - Proje
      description: 'Girdi: `javaVersion`, `springBootVersion` (opsiyonel). Çıktı: `RuntimeProfile` (`sequenceNo`, sürümler,
        `recordedAt`). Başarı: 201 (yeni profil), 200 (güncel profille aynı). 409 nedenleri (problem `type`): `idempotency-conflict`.'
      parameters:
      - $ref: '#/components/parameters/TraceId'
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - bearerAuth: []
      - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeProfileInput'
      responses:
        '201':
          description: Oluşturuldu
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeProfile'
        '200':
          description: Başarılı
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/privacy-notices/latest:
    get:
      operationId: GetPrivacyNotice
      summary: GetPrivacyNotice
      tags:
      - Onay
      description: 'Girdi: —. Çıktı: En son `PrivacyNotice` (`version`, `textTr`, `textEn`, `publishedAt`). Başarı: 200.'
      parameters:
      - $ref: '#/components/parameters/TraceId'
      security:
      - bearerAuth: []
      - internalToken: []
      responses:
        '200':
          description: Başarılı
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyNotice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/projects/{projectId}/consents:
    post:
      operationId: GrantConsent
      summary: GrantConsent
      tags:
      - Onay
      description: 'Girdi: `consentType`, `privacyNoticeVersion`; geri alınmış onayı yeniden verirken `If-Match` (onay `version`).
        Çıktı: `Consent` (`consentType`, `grantedAt`, `revokedAt`, `version`). Başarı: 201 (ilk onay), 200 (geri alınmış onayın
        yeniden verilmesi). 409 nedenleri (problem `type`): `concurrent-modification`, `idempotency-conflict`.'
      parameters:
      - $ref: '#/components/parameters/TraceId'
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: If-Match
        in: header
        required: false
        description: Geri alınmış onayı yeniden verirken onayın `version` değeri (`"<version>"`).
        schema:
          type: string
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentGrant'
      responses:
        '201':
          description: Oluşturuldu
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            ETag:
              description: Kaynağın `version` değeri (tırnak içinde).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
        '200':
          description: Başarılı
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            ETag:
              description: Kaynağın `version` değeri (tırnak içinde).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: GetConsents
      summary: GetConsents
      tags:
      - Onay
      description: 'Girdi: `projectId`. Çıktı: Proje için `Consent` listesi (geçerli olanlar `revokedAt = null`). Başarı:
        200.'
      parameters:
      - $ref: '#/components/parameters/TraceId'
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
      - internalToken: []
      responses:
        '200':
          description: Başarılı
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/projects/{projectId}/consents/{consentType}:
    delete:
      operationId: RevokeConsent
      summary: RevokeConsent
      tags:
      - Onay
      description: 'Girdi: `projectId`, `consentType`, `If-Match` (onay `version`, zorunlu). Çıktı: `Consent` (geri alınmış).
        Başarı: 200. 409 nedenleri (problem `type`): `concurrent-modification`.'
      parameters:
      - $ref: '#/components/parameters/TraceId'
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: consentType
        in: path
        required: true
        schema:
          type: string
          enum:
          - WAREHOUSE_ANALYTICS
          - MODEL_TRAINING
      - $ref: '#/components/parameters/IfMatch'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Başarılı
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            ETag:
              description: Kaynağın `version` değeri (tırnak içinde).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/projects/{projectId}/scans:
    post:
      operationId: StartScan
      summary: StartScan
      tags:
      - Tarama
      description: 'Girdi: `projectId`. Çıktı: `Scan` (`id`, `status = RUNNING`, `startedAt`, `runtimeProfileSequenceNo`).
        Başarı: 201. 409 nedenleri (problem `type`): `scan-already-running`, `idempotency-conflict`.'
      parameters:
      - $ref: '#/components/parameters/TraceId'
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - bearerAuth: []
      - internalToken: []
      responses:
        '201':
          description: Oluşturuldu
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: ListScans
      summary: ListScans
      tags:
      - Tarama
      description: 'Girdi: `projectId`; `page`, `size` (≤ 200). Çıktı: Sayfalı `Scan` listesi (en yeni önce). Başarı: 200.'
      parameters:
      - $ref: '#/components/parameters/TraceId'
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      security:
      - bearerAuth: []
      - internalToken: []
      responses:
        '200':
          description: Başarılı
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/scans/{scanId}/findings:
    post:
      operationId: RecordFindings
      summary: RecordFindings
      tags:
      - Tarama
      description: 'Girdi: En çok 500 bulgu: `path`, `symbol`, `algorithmFamily`, `usageContext`, `locationKind`, `priority`,
        `keySizeBits?`, `lineStart?`, `lineEnd?`, `confidence`, `classifiedBy`. Çıktı: `createdCount`, `existingCount` ve
        yeni bulguların kimlikleri. Başarı: 201. 409 nedenleri (problem `type`): `scan-not-running`, `idempotency-conflict`,
        `finding-limit-exceeded`.'
      parameters:
      - $ref: '#/components/parameters/TraceId'
      - name: scanId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - bearerAuth: []
      - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindingBatch'
      responses:
        '201':
          description: Oluşturuldu
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingBatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: ListFindings
      summary: ListFindings
      tags:
      - Tarama
      description: 'Girdi: Filtreler: `priority`, `algorithmFamily`, `usageContext`, `locationKind`, `classifiedBy`; `page`,
        `size` (≤ 200). Çıktı: Sayfalı `Finding` listesi (dosya yolu ve satır aralığıyla; `source_file` ile birleştirilir).
        Başarı: 200.'
      parameters:
      - $ref: '#/components/parameters/TraceId'
      - name: scanId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: priority
        in: query
        required: false
        schema:
          type: string
          enum:
          - P0
          - P1
          - P2
          - P3
      - name: algorithmFamily
        in: query
        required: false
        schema:
          type: string
          enum:
          - RSA
          - ECDSA
          - ECDH
          - EDDSA
          - DH
          - DSA
          - ML_KEM
          - ML_DSA
          - SLH_DSA
          - AES
          - DES
          - TRIPLE_DES
          - CHACHA20
          - SHA1
          - SHA2
          - SHA3
          - MD5
          - HMAC
          - X25519
          - HYBRID_X25519_MLKEM768
          - UNKNOWN
      - name: usageContext
        in: query
        required: false
        schema:
          type: string
          enum:
          - TLS_KEY_EXCHANGE
          - TLS_SERVER_AUTH
          - MTLS_CLIENT_AUTH
          - CERTIFICATE
          - ENCRYPTION
          - KEY_WRAP
          - SIGNATURE
          - TOKEN_SIGNATURE
          - KEY_AGREEMENT
          - HASH
          - SYMMETRIC_ENCRYPTION
          - KEYSTORE
          - UNKNOWN
      - name: locationKind
        in: query
        required: false
        schema:
          type: string
          enum:
          - CODE
          - CONFIG
          - CERTIFICATE_FILE
          - KEYSTORE_FILE
          - BUILD_FILE
          - TEST_CODE
      - name: classifiedBy
        in: query
        required: false
        schema:
          type: string
          enum:
          - STATIC
          - LLM
      security:
      - bearerAuth: []
      - internalToken: []
      responses:
        '200':
          description: Başarılı
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/scans/{scanId}/topology:
    put:
      operationId: RecordTopology
      summary: RecordTopology
      tags:
      - Tarama
      description: 'Girdi: `nodes` (`name`, `nodeKind`), `links` (`source`, `target`, `protocol`, `tls`, `mtls`, `callSites`
        (`path`, `lineStart`, `lineEnd`, `locationKind`), `findingIds`). Çıktı: `Topology` (`recordedAt`, sayılar). Başarı:
        200. 409 nedenleri (problem `type`): `scan-not-running`.'
      parameters:
      - $ref: '#/components/parameters/TraceId'
      - name: scanId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
      - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopologyInput'
      responses:
        '200':
          description: Başarılı
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topology'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: GetTopology
      summary: GetTopology
      tags:
      - Tarama
      description: 'Girdi: `scanId`. Çıktı: `Topology` (düğümler, bağlantılar, çağrı noktaları, bağlantı–bulgu ilişkileri).
        Başarı: 200.'
      parameters:
      - $ref: '#/components/parameters/TraceId'
      - name: scanId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
      - internalToken: []
      responses:
        '200':
          description: Başarılı
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topology'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/scans/{scanId}/artifact:
    put:
      operationId: RecordScanArtifact
      summary: RecordScanArtifact
      tags:
      - Tarama
      description: 'Girdi: Gövde: CBOM dosyası (en çok 20 MiB); `Content-Type`. Çıktı: `ScanArtifact` (`contentType`, `sha256`,
        `createdAt`). Başarı: 200. 409 nedenleri (problem `type`): `scan-not-running`.'
      parameters:
      - $ref: '#/components/parameters/TraceId'
      - name: scanId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
      - internalToken: []
      requestBody:
        required: true
        content:
          application/vnd.cyclonedx+json:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Başarılı
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanArtifact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: GetScanArtifact
      summary: GetScanArtifact
      tags:
      - Tarama
      description: 'Girdi: `scanId`. Çıktı: CBOM dosyası (gövde), `ETag` = `sha256`. Başarı: 200.'
      parameters:
      - $ref: '#/components/parameters/TraceId'
      - name: scanId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
      - internalToken: []
      responses:
        '200':
          description: Başarılı
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            ETag:
              description: İçeriğin `sha256` değeri (tırnak içinde).
              schema:
                type: string
          content:
            application/vnd.cyclonedx+json:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
