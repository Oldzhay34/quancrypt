        data_tests:
          - unique
          - not_null
      - name: deciding_ring
        data_tests:
          - unique
          - not_null
  - name: dim_strategy
    columns:
      - name: strategy_sk
        data_tests:
          - unique
          - not_null
      - name: strategy_code
        data_tests:
          - unique
          - not_null
  - name: dim_model
    columns:
