              arguments:
                to: ref('dim_date')
                field: date_key
      - name: project_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_project')
                field: project_sk
      - name: language_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_language')
                field: language_sk
      - name: deciding_ring_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_deciding_ring')
                field: deciding_ring_sk
      - name: project_key
        data_tests:
          - not_null
      - name: decision
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ALLOW', 'DENY']
