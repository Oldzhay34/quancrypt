version: 2

models:
  - name: dim_date
    columns:
      - name: date_key
        data_tests:
          - unique
          - not_null
      - name: date_day
        data_tests:
          - unique
          - not_null
  - name: dim_project
    columns:
      - name: project_sk
        data_tests:
          - unique
          - not_null
      - name: project_key
        data_tests:
          - not_null
      - name: origin
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_source')
                field: origin
  - name: dim_service
    columns:
      - name: service_sk
        data_tests:
          - unique
          - not_null
      - name: project_key
        data_tests:
          - not_null
  - name: dim_algorithm
    columns:
      - name: algorithm_sk
        data_tests:
          - unique
          - not_null
      - name: algorithm_family
        data_tests:
          - unique
          - not_null
      - name: quantum_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['VULNERABLE', 'RESISTANT', 'SYMMETRIC_OR_HASH', 'UNKNOWN']
  - name: dim_usage_context
    columns:
      - name: usage_context_sk
        data_tests:
          - unique
          - not_null
      - name: usage_context
        data_tests:
          - unique
          - not_null
  - name: dim_location_kind
    columns:
      - name: location_kind_sk
        data_tests:
          - unique
          - not_null
      - name: location_kind
        data_tests:
          - unique
          - not_null
  - name: dim_priority
    columns:
      - name: priority_sk
        data_tests:
          - unique
          - not_null
      - name: priority
        data_tests:
          - unique
          - not_null
  - name: dim_library
    columns:
      - name: library_sk
        data_tests:
          - unique
          - not_null
      - name: library
        data_tests:
          - unique
          - not_null
  - name: dim_source
    columns:
      - name: source_sk
        data_tests:
          - unique
          - not_null
      - name: origin
        data_tests:
          - unique
          - not_null
  - name: dim_protocol
    columns:
      - name: protocol_sk
        data_tests:
          - unique
          - not_null
      - name: protocol
        data_tests:
          - unique
          - not_null
  - name: dim_language
    columns:
      - name: language_sk
        data_tests:
          - unique
          - not_null
