version: 2

sources:
  - name: prep
    schema: prep
    description: The clean, canonical and anonymous tables the preprocessing pipeline writes (P6.4). raw is never read.
    tables:
      - name: project_snapshot
      - name: analysis_unit
      - name: finding
      - name: topology_summary
      - name: service_link
      - name: scope_decision
      - name: algorithm_family
      - name: usage_context
      - name: location_kind
      - name: priority
      - name: protocol
      - name: language
      - name: deciding_ring
      - name: project_origin
  - name: ingest
    schema: ingest
    description: Only the consent revocation audit (KVKK filter, D-318c).
    tables:
      - name: ingest_audit
  - name: labels
    schema: labels
    description: >
      The gold labels of Model A (P7.1, ml/migrations, D-322d). Optional: the schema exists only after `ml migrate`;
      mart_risk_features reads it only when it is there.
    tables:
      - name: label_batch
      - name: label_batch_item
      - name: gold_label
      - name: label_resolution
  - name: ml_outputs
    schema: ml_outputs
    description: >
      Model A's versions, predictions and metrics (P7.2, ml/migrations 0002, D-327d). Optional: the schema exists only
      after `ml migrate`; the marts read it only when it is there.
    tables:
      - name: model_version
      - name: published_model
      - name: risk_prediction
      - name: model_metric
      - name: mining_run
      - name: archetype
      - name: project_archetype
      - name: anomaly
