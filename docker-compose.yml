name: quancrypt

# Tek kök compose dosyası (D-27). Servis profilleri ilgili alt fazlarda eklenir.
# `postgres` profilsizdir: her `make up`'ta kalkar (D-53).
# Ollama host'ta çalışır (D-51); bu dosyada ollama servisi yoktur.

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    # Yalnızca gereken değişkenler konteynere geçer; `.env` dosyasının tamamı geçmez.
    # Eksik değişken compose'u hata ile durdurur (`:?`).
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD .env içinde tanımlı olmalı}
      CORE_DB_MIGRATOR_PASSWORD: ${CORE_DB_MIGRATOR_PASSWORD:?CORE_DB_MIGRATOR_PASSWORD .env içinde tanımlı olmalı}
      CORE_DB_APP_PASSWORD: ${CORE_DB_APP_PASSWORD:?CORE_DB_APP_PASSWORD .env içinde tanımlı olmalı}
      AGENT_DB_MIGRATOR_PASSWORD: ${AGENT_DB_MIGRATOR_PASSWORD:?AGENT_DB_MIGRATOR_PASSWORD .env içinde tanımlı olmalı}
      AGENT_DB_APP_PASSWORD: ${AGENT_DB_APP_PASSWORD:?AGENT_DB_APP_PASSWORD .env içinde tanımlı olmalı}
      WAREHOUSE_DB_MIGRATOR_PASSWORD: ${WAREHOUSE_DB_MIGRATOR_PASSWORD:?WAREHOUSE_DB_MIGRATOR_PASSWORD .env içinde tanımlı olmalı}
      WAREHOUSE_DB_APP_PASSWORD: ${WAREHOUSE_DB_APP_PASSWORD:?WAREHOUSE_DB_APP_PASSWORD .env içinde tanımlı olmalı}
      WAREHOUSE_READER_PASSWORD: ${WAREHOUSE_READER_PASSWORD:?WAREHOUSE_READER_PASSWORD .env içinde tanımlı olmalı}
      MLFLOW_DB_MIGRATOR_PASSWORD: ${MLFLOW_DB_MIGRATOR_PASSWORD:?MLFLOW_DB_MIGRATOR_PASSWORD .env içinde tanımlı olmalı}
      MLFLOW_DB_APP_PASSWORD: ${MLFLOW_DB_APP_PASSWORD:?MLFLOW_DB_APP_PASSWORD .env içinde tanımlı olmalı}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - quancrypt
    healthcheck:
      # `-h 127.0.0.1` (TCP) zorunludur: ilk açılışta geçici sunucu yalnızca unix soketini
      # dinler, soket üzerinden kontrol init betikleri bitmeden "healthy" derdi.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # ---- `demo` profili: QBank referans sistemi (D-29, P1.4) ----
  # Ağlar (D-122): `qbank-net` (internal) gateway, hesap, ödeme ve Mosquitto'yu taşır; `qbank-device` (internal) yalnızca
  # Mosquitto ve saha cihazını taşır. Cihaz hesap ve ödeme servisine ağdan ulaşamaz, yalnızca broker'a ulaşır. Yalnızca
  # `qbank-gateway` ayrıca `quancrypt` ağına bağlıdır ve 127.0.0.1:9443'te yayımlanır. Sertifika ve anahtarlar yalnızca gereken dosyalar tek tek salt okunur bağlanır
  # (D-115); `ca.key.pem` ve `card-token.key.pem` hiçbir konteynere girmez. Sağlık kontrolleri imajların
  # HEALTHCHECK'inden gelir (Mosquitto hariç).
  core-service:
    profiles: [app]
    build:
      # The build context is the repository root (the redaction rules are copied from contracts/); the allow-list in
      # services/core-service/Dockerfile.dockerignore keeps .env, keys and every other service out of it.
      context: .
      dockerfile: services/core-service/Dockerfile
    image: core-service:1.0.0
    environment:
      CORE_DB_URL: jdbc:postgresql://postgres:5432/core_db
      # No :? here, so that make up without the app profile keeps working before these keys exist in .env; the service itself
      # refuses to start without a real value (it never has a default for a secret).
      CORE_DB_APP_PASSWORD: ${CORE_DB_APP_PASSWORD:-}
      CORE_DB_MIGRATOR_PASSWORD: ${CORE_DB_MIGRATOR_PASSWORD:-}
      QUANCRYPT_ANON_SALT: ${QUANCRYPT_ANON_SALT:-}
      QUANCRYPT_SESSION_TOKEN: ${QUANCRYPT_SESSION_TOKEN:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      INGEST_API_URL: ${INGEST_API_URL:-}
      OUTBOX_RELAY_ENABLED: ${OUTBOX_RELAY_ENABLED:-false}
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - quancrypt
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 40s

  analyzer-service:
    profiles: [app]
    build:
      # The build context is the repository root (the canonical dictionary and the redaction rules are copied from
      # contracts/); the allow-list in services/analyzer-service/Dockerfile.dockerignore keeps .env, keys and every other
      # service out of it.
      context: .
      dockerfile: services/analyzer-service/Dockerfile
    image: analyzer-service:1.0.0
    environment:
      # No :? here, so that make up without the app profile keeps working before this key exists in .env; the service itself
      # refuses to start without a real value (it never has a default for a secret).
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      ANALYSIS_TIME_BUDGET_SECONDS: ${ANALYSIS_TIME_BUDGET_SECONDS:-300}
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      # The analyzed project, read-only: the analyzer never writes (docker-local, section 2). PROJECT_ROOT must be set in .env
      # for this service; the /dev/null default only keeps the file valid for the other profiles and fails clearly here.
      - ${PROJECT_ROOT:-/dev/null}:/workspace:ro
      # The corpus clones (and the benchmark copies below _benchmarks/), read-only, for the corpus flows of data-platform (P6.2).
      # The analyzer only accepts roots below /workspace and /corpus (contracts/openapi/analyzer-service.yaml).
      - ${CORPUS_ROOT:-/dev/null}:/corpus:ro
    networks:
      - quancrypt
    # JavaParser needs memory in proportion to the largest source file; the JVM takes 75 % of this limit (MaxRAMPercentage).
    mem_limit: 2g
    stop_grace_period: 40s

  agent-service:
    profiles: [app]
    build:
      # The build context is the repository root (the tool contracts and the redaction rules are copied from contracts/);
      # services/agent-service/Dockerfile.dockerignore lets in only what the image needs.
      context: .
      dockerfile: services/agent-service/Dockerfile
    image: agent-service:1.0.0
    environment:
      # Ollama runs on the host (D-51). The host value in .env (127.0.0.1) is not valid inside a container, so the address is
      # fixed here (D-219). Its peers are Ollama on the host and agent_db in the postgres service (P4.2); the database
      # address carries no password, the passwords come from their own variables. No :? here, so that make up without the app
      # profile keeps working; the service itself refuses to start without a real password (settings, fail-fast).
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      AGENT_DB_URL: postgresql+psycopg://agent_db_app@postgres:5432/agent_db
      AGENT_DB_MIGRATOR_URL: postgresql+psycopg://agent_db_migrator@postgres:5432/agent_db
      AGENT_DB_APP_PASSWORD: ${AGENT_DB_APP_PASSWORD:-}
      AGENT_DB_MIGRATOR_PASSWORD: ${AGENT_DB_MIGRATOR_PASSWORD:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The tools' peers (P4.3): only these compose names; the service refuses a missing or placeholder token.
      CORE_SERVICE_URL: http://core-service:8081
      ANALYZER_SERVICE_URL: http://analyzer-service:8082
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      # The UI session token (P4.6); the service refuses a missing or placeholder token. The outbox relay is off by default
      # and is opened with the lines in .env.example (P6.1, D-296k). LangSmith tracing is forced off: nothing leaves the machine.
      QUANCRYPT_SESSION_TOKEN: ${QUANCRYPT_SESSION_TOKEN:-}
      OUTBOX_RELAY_ENABLED: ${OUTBOX_RELAY_ENABLED:-false}
      INGEST_API_URL: ${INGEST_API_URL:-}
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    extra_hosts:
      # Only this service reaches the host (docker-local, section 2).
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8083:8083"
    networks:
      - quancrypt
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 40s

  web-ui:
    profiles: [app]
    build:
      # A static site built from apps/web-ui and served by nginx as user 10001 (P5.2). It has no environment: the two service
      # addresses (127.0.0.1:8081 and :8083) are fixed in the page and in its Content-Security-Policy.
      context: ./apps/web-ui
    image: web-ui:1.0.0
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - quancrypt

  qbank-account-service:
    profiles: [demo]
    build:
      context: ./reference-system/qbank-account-service
    image: qbank-account-service:1.0.0
    networks:
      - qbank-net
    volumes:
      - ./reference-system/certs/out/ca.crt.pem:/certs/ca.crt.pem:ro
      - ./reference-system/certs/out/qbank-account-service.crt.pem:/certs/qbank-account-service.crt.pem:ro
      - ./reference-system/certs/out/qbank-account-service.key.pem:/certs/qbank-account-service.key.pem:ro
      - ./reference-system/certs/out/jwt-signing.key.pem:/certs/jwt-signing.key.pem:ro
      - ./reference-system/certs/out/jwt-signing.pub.pem:/certs/jwt-signing.pub.pem:ro

  qbank-payment-service:
    profiles: [demo]
    build:
      context: ./reference-system
      dockerfile: qbank-payment-service/Dockerfile
    image: qbank-payment-service:1.0.0
    networks:
      - qbank-net
    volumes:
      - ./reference-system/certs/out/ca.crt.pem:/certs/ca.crt.pem:ro
      - ./reference-system/certs/out/qbank-payment-service.crt.pem:/certs/qbank-payment-service.crt.pem:ro
      - ./reference-system/certs/out/qbank-payment-service.key.pem:/certs/qbank-payment-service.key.pem:ro
      - ./reference-system/certs/out/payment-to-account.crt.pem:/certs/payment-to-account.crt.pem:ro
      - ./reference-system/certs/out/payment-to-account.key.pem:/certs/payment-to-account.key.pem:ro
      - ./reference-system/certs/out/payment-to-mosquitto.crt.pem:/certs/payment-to-mosquitto.crt.pem:ro
      - ./reference-system/certs/out/payment-to-mosquitto.key.pem:/certs/payment-to-mosquitto.key.pem:ro
      - ./reference-system/certs/out/card-token.pub.pem:/certs/card-token.pub.pem:ro
      - ./reference-system/certs/out/receipt-signing.pub.pem:/certs/receipt-signing.pub.pem:ro
      - ./reference-system/certs/out/receipt-signing.key.pem:/certs/receipt-signing.key.pem:ro
    depends_on:
      qbank-account-service:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  mosquitto:
    profiles: [demo]
    image: eclipse-mosquitto:2.0.22
    networks:
      - qbank-net
      - qbank-device
    volumes:
      - ./reference-system/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./reference-system/mosquitto/acl:/mosquitto/config/acl:ro
      - ./reference-system/certs/out/ca.crt.pem:/mosquitto/certs/ca.crt.pem:ro
      - ./reference-system/certs/out/mosquitto.crt.pem:/mosquitto/certs/mosquitto.crt.pem:ro
      - ./reference-system/certs/out/mosquitto.key.pem:/mosquitto/certs/mosquitto.key.pem:ro
    # Persistence is off (mosquitto.conf has none) and logs go to stdout: tmpfs keeps the image's VOLUME paths from
    # leaving anonymous volumes behind on every recreate.
    tmpfs:
      - /mosquitto/data
      - /mosquitto/log
    healthcheck:
      # Dinleme kontrolü: broker istemci sertifikası zorunlu kıldığından konteyner içinden bir MQTT istemcisi açılmaz.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8883"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  qbank-gateway:
    profiles: [demo]
    build:
      context: ./reference-system/qbank-gateway
    image: qbank-gateway:1.0.0
    networks:
      - qbank-net
      - quancrypt
    ports:
      - "127.0.0.1:9443:9443"
    volumes:
      - ./reference-system/certs/out/ca.crt.pem:/certs/ca.crt.pem:ro
      - ./reference-system/certs/out/qbank-gateway.crt.pem:/certs/qbank-gateway.crt.pem:ro
      - ./reference-system/certs/out/qbank-gateway.key.pem:/certs/qbank-gateway.key.pem:ro
      - ./reference-system/certs/out/gateway-to-account.crt.pem:/certs/gateway-to-account.crt.pem:ro
      - ./reference-system/certs/out/gateway-to-account.key.pem:/certs/gateway-to-account.key.pem:ro
    depends_on:
      qbank-account-service:
        condition: service_healthy
      qbank-payment-service:
        condition: service_healthy

  field-device-sim:
    profiles: [demo]
    build:
      context: ./reference-system/field-device-sim
    image: field-device-sim:1.0.0
    networks:
      - qbank-device
    volumes:
      - ./reference-system/certs/out/ca.crt.pem:/certs/ca.crt.pem:ro
      - ./reference-system/certs/out/terminal-001.crt.pem:/certs/terminal-001.crt.pem:ro
      - ./reference-system/certs/out/terminal-001.key.pem:/certs/terminal-001.key.pem:ro
    depends_on:
      mosquitto:
        condition: service_healthy

  # Veri platformunun giriş kapısı (P6.1): core-service ve agent-service outbox relay'lerinin olaylarını warehouse_db.raw'a yazar
  # (D-20, D-295). Servis adı `ingest-api` olmalı: agent-service INGEST_API_URL host'unu yalnızca bununla ve loopback ile sınırlar.
  ingest-api:
    profiles: [data]
    build:
      # The build context is the repository root (the event schemas are copied from contracts/schemas/events); the allow-list
      # in data-platform/Dockerfile.dockerignore keeps .env, keys and every other service out of it.
      context: .
      dockerfile: data-platform/Dockerfile
    image: ingest-api:1.0.0
    environment:
      WAREHOUSE_DB_URL: postgresql+psycopg://warehouse_db_app@postgres:5432/warehouse_db
      WAREHOUSE_DB_MIGRATOR_URL: postgresql+psycopg://warehouse_db_migrator@postgres:5432/warehouse_db
      # No :? here (same reason as core-service); the service refuses to start without real values.
      WAREHOUSE_DB_APP_PASSWORD: ${WAREHOUSE_DB_APP_PASSWORD:-}
      WAREHOUSE_DB_MIGRATOR_PASSWORD: ${WAREHOUSE_DB_MIGRATOR_PASSWORD:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    ports:
      - "127.0.0.1:8084:8084"
    networks:
      - quancrypt
    # An 8 MiB request is about 260 MB once parsed and the endpoint lets 4 run at once (D-297d): a runaway request
    # must not take the whole machine. The value is a margin, not a measurement of the steady state.
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 40s

networks:
  # Uygulama ve veri servisleri.
  quancrypt: {}
  # Demo sistemi (QBank): dış ağa çıkamaz. Yalnızca qbank-gateway ayrıca `quancrypt` ağına bağlıdır (P1.4).
  qbank-net:
    internal: true
  # Saha cihazı ağı (P1.4, D-122): yalnızca Mosquitto ve field-device-sim. Dış ağa çıkamaz.
  qbank-device:
    internal: true

volumes:
  pgdata: {}
