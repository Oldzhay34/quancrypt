# QBank beklenen kripto envanteri (P1.4, D-112) — Quancrypt analizci testlerinin altın verisi.
#
# DURUM: kullanıcı onayı BEKLİYOR. Onaylanana kadar Faz 3 testlerinde kullanılmaz; onay DECISIONS.md'ye yazılır.
#
# Kapsam ve kurallar:
#   * `file` yolları `reference-system/` köküne göre yazılır. `certs/out/` üretilmiş dosyalardır (git'te yoktur);
#     `bash certs/generate.sh` onları üretir. Satır numarası yazılmaz, kod değiştikçe kırılmasın.
#   * `symbol`: koddaki kayıtlar için sınıf#metot, yapılandırmadaki kayıtlar için yapılandırma anahtarı,
#     sertifika ve anahtar dosyaları için dosya adı. Kodlar `crypto-domain` skill'indendir.
#   * Yalnızca kuantum açısından anlamlı kullanımlar yazılır (RSA, RS256 JWT, SHA1withRSA, TLS/mTLS sertifikaları
#     ve anahtar dosyaları). Kayıt DIŞI: SHA-256 (JWK thumbprint `JwkThumbprint`, istek parmak izi
#     `RequestFingerprint`) ve BCrypt (parola özeti, `BcryptPasswordVerifier`) kuantum açısından bulgu değildir;
#     anahtar yükleyiciler (`PemKeyLoader`, `KeyFactory.getInstance("RSA")`) yalnızca anahtar nesnesini kurar,
#     kullanım bağlamı onu çağıran imza/şifreleme/TLS kayıtlarındadır; `certs/generate.sh` anahtarları ve
#     sertifikaları üretir, kullanmaz (ürettiği dosyalar aşağıda kayıtlıdır); test kodu (`TEST_CODE`) kapsam dışıdır;
#     `terminal-transaction.schema.json` ve OpenAPI kontratları kripto içermez.
#   * Modelleme kuralı (crypto-domain öncelik tablosuna sıkı bağlı, D-112):
#       - TLS bağlantısının kendisi (sunucu `server.ssl.bundle`, istemci kodu ve adresi `https://`/`ssl://`):
#         usage_context TLS_KEY_EXCHANGE, P1 HYBRID_TLS_KEX (cihaz bağlantıları DEVICE_HYBRID_TLS).
#       - mTLS kimlik doğrulaması (`client-auth`, `require_certificate`, istemci kimliği taşıyan SSL bundle'ları):
#         usage_context MTLS_CLIENT_AUTH, P3 HYBRID_KEX_CLASSIC_CERT. Sunucu SSL bundle'ları ve sertifika
#         dosyaları: usage_context CERTIFICATE, P3 HYBRID_KEX_CLASSIC_CERT.
#       - TLS kayıtlarında `algorithm_family` sertifikanın anahtar ailesidir (RSA-2048). Pazarlık edilen TLS sürümü
#         ve anahtar değişim grubu (x25519, cihaz kenarında X25519MLKEM768) topology.yaml'da ölçülmüş olarak yazılıdır.
#   * Çıplak anahtar PEM'leri (`*.key.pem`, `*.pub.pem`) `location_kind: CERTIFICATE_FILE` ile yazılır (D-112).
#     Özel anahtar dosyalarının içeriği okunmaz; bu kayıtlar dosya adı ve başlığına dayanır (D-72).
#   * Öncelik ve strateji kodları: P0 FIX_WEAK_CLASSIC; P1 HYBRID_TLS_KEX, KEM_DEM_ENCRYPTION, DEVICE_HYBRID_TLS;
#     P3 KEEP_SHORT_LIVED_TOKEN, HYBRID_KEX_CLASSIC_CERT.
#   * Bilerek zayıf olanlar: receipt-signing RSA-1024 ve SHA1withRSA (P0), bkz. reference-system/README.md.
