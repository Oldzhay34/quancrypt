# QBank MQTT broker (D-29, D-118): TLS only, a client certificate is required and its common name is the user name.
# Certificates are bind-mounted read-only under /mosquitto/certs; the ACL under /mosquitto/config/acl.
listener 8883
cafile /mosquitto/certs/ca.crt.pem
certfile /mosquitto/certs/mosquitto.crt.pem
keyfile /mosquitto/certs/mosquitto.key.pem
require_certificate true
use_identity_as_username true
allow_anonymous false
acl_file /mosquitto/config/acl
log_dest stdout
