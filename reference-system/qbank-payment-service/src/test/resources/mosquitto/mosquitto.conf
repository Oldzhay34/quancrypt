# Test broker of the payment service MQTT integration test: TLS only, a client certificate is required and its
# common name becomes the user name.
listener 8883
cafile /mosquitto/certs/ca.crt.pem
certfile /mosquitto/certs/mosquitto.crt.pem
keyfile /mosquitto/certs/mosquitto.key.pem
require_certificate true
use_identity_as_username true
allow_anonymous false
