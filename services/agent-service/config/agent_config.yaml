# Agent definitions (P4.1). `tools` is each agent's allow-list; P4.3 fills it. Budgets follow D-217:
# discovery and topology run without an LLM (max_tokens 0).
agents:
  supervisor:
    tools: []
    budget:
      max_steps: 6
      max_tokens: 2048
      timeout_s: 120
  discovery:
    tools: []
    budget:
      max_steps: 8
      max_tokens: 0
      timeout_s: 60
  topology:
    tools: []
    budget:
      max_steps: 8
      max_tokens: 0
      timeout_s: 60
  planner:
    tools: []
    budget:
      max_steps: 10
      max_tokens: 4096
      timeout_s: 180

# Scope guard settings (P4.4 fills this section).
guardrails: {}

# What the output checker does with a claim it cannot match to a tool output (strip | flag).
output_check:
  on_mismatch: flag
