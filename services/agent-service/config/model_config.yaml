# Model settings (P4.1). Models come from docs/VERSIONS.md (P0.4, D-68); context and output limits from D-217.
# `${NAME}` and `${NAME:-default}` are expanded from the environment; an unresolved name stops the service (fail-fast).
llm:
  # ollama: local Ollama; null: no language model (NFR-05, envanter ve plan üretilir, açıklama "LLM kapalı" notu taşır).
  provider: ${LLM_PROVIDER:-ollama}

ollama:
  # Phase 1 is local only: the host must be localhost, 127.0.0.1, ::1, host.docker.internal or ollama (settings.py).
  base_url: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
  chat_model: gemma3:4b
  embedding_model: embeddinggemma:latest
  embedding_dimensions: 768
  temperature: 0.2
  num_ctx: 8192
  num_predict: 1024
  connect_timeout_s: 3
  timeout_s: 120
  retry:
    max_attempts: 3
    wait_initial_s: 0.5
    wait_max_s: 4
  circuit_breaker:
    fail_max: 5
    reset_timeout_s: 30
  # Readiness probe (GET /api/tags): short timeout, the answer is cached briefly so frequent probes do not hit Ollama.
  health_timeout_s: 2
  health_cache_s: 5

# The risk model of score_findings (P7.5, D-343a): onnx (Model A) or rule_baseline. With onnx a missing model file stops
# the service; it never falls back to the baseline on its own.
risk_model: ${RISK_MODEL:-onnx}

# Local ONNX models (ml P7.2 and P7.3), read from models_dir (the root models/ folder; /models in the container). Model A
# is the dry run trained on silver labels until the gold labels exist (D-343a): after `ml train-risk` with gold labels
# risk_model_file becomes risk_model-v1.onnx and risk_model_id risk_model_v1.
onnx:
  models_dir: ${MODELS_DIR:-../../models}
  risk_model_file: risk_model-v1-dry_run.onnx
  risk_model_id: risk_model_v1_dry_run
  scope_model_file: scope_classifier-v1.onnx
  scope_thresholds_file: scope_classifier-v1.thresholds.json
